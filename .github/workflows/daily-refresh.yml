name: Daily Data Refresh

on:
  schedule:
    # 3:45 AM UTC = 9:15 AM IST, Monday-Friday. See Docs/RAG-Architecture.md §8.
    - cron: "45 3 * * 1-5"
  workflow_dispatch: {}

concurrency:
  group: daily-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Phase 2 (Ingestion): fetch -> parse -> chunk -> embed -> store,
      # per Docs/Ingestion-Architecture.md. Replaces the Phase 1 placeholder.
      - name: Run ingestion pipeline
        run: python phase-2-ingestion/run_ingestion.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/chroma data/ingestion_manifest.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Daily data refresh: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
